<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The app does not zoom, like a native app. `maximum-scale` and `user-scalable` stop the pinch zoom on Android, and
      stop the zoom of iOS when a small input gets the focus. iOS 10 and later ignore them for the pinch zoom, so
      `base.css` and `main.ts` stop that zoom on iOS. See "Zoom" in `text-input.usage.ts`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SplitZ</title>
    <meta name="description" content="Split expenses with friends and groups" />
    <meta name="theme-color" content="#f9fbfa" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#647C72" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
