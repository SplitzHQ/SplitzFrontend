<!doctype html>
<!-- Design-system docs. The dev server serves this page at /design-system.html. The build uses only index.html, so this page is not in the production bundle. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>SplitZ Design System</title>
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem("splitz:design-system-theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/design-system/main.ts"></script>
  </body>
</html>
